---
name-template: "v$RESOLVED_VERSION 🌈"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"

exclude-labels:
  - "skip-changelog"

categories:
  - title: "🚨 Breaking changes"
    labels:
      - "breaking-change"
  - title: "✨ New features"
    labels:
      - "new-feature"
  - title: "🐛 Bug fixes"
    labels:
      - "bugfix"
  - title: "🚀 Enhancements"
    labels:
      - "enhancement"
      - "refactor"
      - "performance"
  - title: "🧰 Maintenance"
    labels:
      - "maintenance"
      - "ci"
  - title: "📚 Documentation"
    labels:
      - "documentation"
  - title: "⬆️ Dependency updates"
    labels:
      - "dependencies"

  - title: "⬆️ Dev Dependency updates"
    labels:
      - "dev-deps"

# TEMPORARY (until revoked by @tb1337): "breaking-change" and "new-feature"
# resolve to a patch bump instead of major/minor. To restore the normal scheme,
# move "breaking-change" back under major and "new-feature" back under minor.
# The bare "major"/"minor" labels stay wired up as a manual override in the
# meantime — put one on a PR to force that bump for a single release.
version-resolver:
  major:
    labels:
      - "major"
  minor:
    labels:
      - "minor"
  patch:
    labels:
      - "breaking-change" # temporary, see note above
      - "bugfix"
      - "ci"
      - "dependencies"
      - "dev-deps"
      - "enhancement"
      - "new-feature" # temporary, see note above
      - "performance"
      - "refactor"
  default: patch

template: |
  ## Changes

  $CHANGES
