---
name: Testing

# No paths filter on purpose: this is a required check, and GitHub treats a
# required check that never started as permanently pending. A filtered workflow
# would deadlock every PR that only touches docs or config.
# yamllint disable-line rule:truthy
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_PYTHON: "3.14"

jobs:
  pytest:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
      - name: 🏗 Set up Python ${{ matrix.python }}
        id: python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: 🏗 Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: 🏗 Install Python dependencies
        run: uv sync --group dev
      - name: 🚀 Run pytest
        run: uv run pytest -v
      - name: 🚀 Upload coverage report
        if: matrix.python == env.COVERAGE_PYTHON
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
