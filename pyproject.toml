[project]
name = "paperless-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Paperless-ngx, backed by pypaperless."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Tobias Schulz" }]
keywords = ["paperless", "paperless-ngx", "mcp", "model-context-protocol", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=1.2.0",
    "pypaperless @ git+https://github.com/tb1337/paperless-api@main",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.scripts]
paperless-mcp = "paperless_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/tb1337/paperless-mcp"
Issues = "https://github.com/tb1337/paperless-mcp/issues"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "prek>=0.0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "D",             # pydocstyle
]
ignore = [
    "D203",          # one-blank-line-before-class (conflicts with D211)
    "D213",          # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"src/paperless_mcp/__main__.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["paperless_mcp"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pypaperless.*"]
ignore_missing_imports = true
