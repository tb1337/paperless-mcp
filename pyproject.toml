[project]
name = "paperless-mcp"
# Placeholder. The release workflow rewrites this from the git tag before
# building, so the tag is the single source of truth for a published version.
version = "0.0.0"
description = "Model Context Protocol server for Paperless-ngx, backed by pypaperless."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Tobias Schulz" }]
keywords = ["paperless", "paperless-ngx", "mcp", "model-context-protocol", "llm"]
classifiers = [
    # Matches the warning at the top of the README: the tool surface still
    # shifts between releases.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = [
    # 2.0 renamed FastMCP to MCPServer and moved mcp.server.fastmcp to
    # mcp.server.mcpserver, so the major is capped: an unbounded `>=` would let
    # a future major install a version this package cannot import, which an MCP
    # client reports only as "server disconnected".
    "mcp>=2.0.0,<3",
    # Pinned exactly: this server tracks the library's model and service shapes
    # closely enough that a minor bump is a deliberate change with a test run.
    "pypaperless==6.0.0",
    # Kept in step with pypaperless: the AsyncClient built here is handed to
    # PaperlessClient, so both halves must agree on the httpx version. The major
    # is capped because httpx 1.x drops `httpx.AsyncClient` (1.0.dev3 exposes
    # only `Client`), which both halves annotate against. pypaperless itself
    # requires an unbounded `httpx>=0.28.1`, so nothing upstream stops a
    # resolver from reaching 1.x once it lands, and `--prerelease=allow` reaches
    # the dev builds today. Uncapped, the server dies on import with
    # "module 'httpx' has no attribute 'AsyncClient'".
    "httpx>=0.28.1,<1",
    # Imported directly, not just transitively through mcp and pypaperless:
    # `tools/_errors` maps ValidationError to `invalid_argument`, and
    # `formatting.safe_dump` dispatches on BaseModel. Both are v2 APIs, and the
    # major is capped because a v3 would move them.
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
    "starlette>=1.6.0,<2",
]

[project.scripts]
paperless-mcp = "paperless_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/tb1337/paperless-mcp"
"Source Code" = "https://github.com/tb1337/paperless-mcp"
"Bug Reports" = "https://github.com/tb1337/paperless-mcp/issues"
Coverage = "https://codecov.io/gh/tb1337/paperless-mcp"

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "covdefaults>=2.3.0",
    "coverage>=7.15.4",
    "mypy>=2.3.0",
    "prek>=0.4.12",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "yamllint>=1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_mcp"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "D",             # pydocstyle
    "A",             # builtin shadowing
    "ARG",           # unused arguments
    "ASYNC",         # async antipatterns
    "BLE",           # blind except: makes "catch only expected exceptions" enforced
    "DTZ",           # naive datetime construction
    "ERA",           # commented-out code, the counterpart to "comments explain why"
    "EXE",           # shebang / executable-bit mismatch
    "FA",            # pins the mandatory `from __future__ import annotations`
    "FURB",          # refurb modernizations
    "G",             # no f-strings in logging calls (they format even when filtered)
    "ICN",           # import conventions
    "INP",           # implicit namespace packages
    "INT",           # gettext
    "ISC",           # implicit string concat
    "LOG",           # logging misuse
    "PERF",          # obvious perf antipatterns
    "PIE",           # misc lints
    "PLC", "PLE", "PLR", "PLW",  # pylint
    "PT",            # pytest style
    "PTH",           # pathlib over os.path
    "RET",           # return simplification
    "RSE",           # raise
    "C901",          # cyclomatic complexity, see [tool.ruff.lint.mccabe]
    "S",             # bandit
    "SLF",           # private-member access
    "SLOT",          # __slots__ on str/tuple subclasses
    "T20",           # print / pprint
    "YTT",           # sys.version misuse
]
# Deliberately NOT selected, with what each reports on this tree today, so the
# question does not get re-litigated:
#   TID252  (84) every intra-package relative import; the layout is the convention
#   TC      (63) `from __future__ import annotations` is mandatory in every module
#                already, so a runtime/type import split buys churn, not safety
#   TRY003
#     + EM (172) the exception message IS the model-facing payload - `_ERROR_MAP`
#                turns it into `cause` - so it belongs at the raise site
#   COM812 (167) conflicts with `ruff format`
#   ANN    (329, nearly all ANN401) mypy --strict is the same check with real
#                inference; ANN401 would only push `Any` behind an alias
#   FBT     (37) a tool's positional bool parameters ARE its JSON schema
#   DOC    (161) preview only
#   CPY     (51) this project carries no per-file copyright header
#   Q        (0) `ruff format` already owns quoting, and one decision wants one
#                owner - two is how the COM812 conflict starts
ignore = [
    "D203",          # one-blank-line-before-class (conflicts with D211)
    "D213",          # multi-line-summary-second-line (conflicts with D212)
    "ISC001",        # single-line implicit concat: `ruff format` owns this
    # `wait_for_task(..., timeout=)` must not become an `anyio` cancel scope: it
    # returns `(task, timed_out)` because a tool reports a timeout as data, never
    # by raising (see the tool contract in AGENTS.md).
    "ASYNC109",
    # The naive datetime never escapes: the one `strptime` in the tree is reduced
    # to a `date` on the same line. DTZ011 stays on, and it is the one that found
    # a real bug (`date.today()` in the monthly-review window).
    "DTZ007",
    # Magic values. `0 <= port <= 65535`, `status == 200` and
    # `degrees in {90, 180, 270}` read better as literals than behind a name, and
    # 64 of the 71 findings are expected values in test assertions.
    "PLR2004",
    # A tool signature IS the JSON schema the model sees, and it is spelled out on
    # purpose - `search_documents` takes 30 arguments because the model needs to
    # see all 30 filters.
    "PLR0913", "PLR0917",
    # Statement count. Its only findings were the `register()` closures, which are
    # gone; what is left in reach of it is a tool signature's worth of arguments
    # being unpacked, where the count is the schema rather than complexity.
    "PLR0915",
]

[tool.ruff.lint.mccabe]
# Paired with "C901" in `select`. The findings that made this unenforceable were
# the `register()` closures and two argument-to-lookup ladders, and both are gone -
# so the limit can be the default rather than a number chosen to fit them.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",                             # tests document themselves through their names
    "S101",                          # `assert` IS the test
    "S104", "S105", "S106",          # "0.0.0.0" and the fake tokens are literal on purpose
    "ARG001", "ARG002", "ARG005",    # a requested-but-unread fixture is how pytest
                                     # spells "apply this patch", and the fakes
                                     # record keywords they never read
    "DTZ001",                         # parse_datetime returns naive datetimes by
                                      # design (Paperless sends wall-clock dates),
                                      # so the expected values have to be naive too
    "SLF001",                         # MCPServer offers no public way to enumerate
                                      # tools or enter a lifespan outside a live
                                      # session; the suite drives the real server
]
"src/paperless_mcp/__main__.py" = [
    "D",
    # A configuration error has to reach the user's terminal before
    # `configure_logging` has run; a log record at that point goes nowhere.
    "T201",
]
"src/paperless_mcp/healthcheck.py" = [
    # S104 fires on the "0.0.0.0" literal, which sits in a deny-list that rewrites
    # a bind-all host *to* loopback - the opposite of binding to all interfaces.
    "S104",
]
"src/paperless_mcp/formatting.py" = [
    # `safe_dump` dispatches on eight types and returns from each. The branch count
    # is the number of shapes JSON has to be reached from, not complexity - a
    # `singledispatch` would hide the one ordering that is load-bearing (a pydantic
    # model has to be tried before Mapping).
    "PLR0911",
]
"src/paperless_mcp/tools/custom_field_values.py" = [
    # `_plain_value` is a `match` over the ten custom field data types. Splitting it
    # would put five of them behind a helper and leave the reader chasing which type
    # goes where; the ten arms in one place are the point.
    "C901", "PLR0911", "PLR0912",
]
"src/paperless_mcp/names.py" = [
    # `_collect` catches Exception deliberately: its six calls are siblings under
    # one `asyncio.gather`, so an escaping exception cancels the other five and
    # costs the caller every other name. The reasoning is in its docstring.
    "BLE001",
]
# run/debug.py is a scratch pad driven from the debugger: a value parked in a
# name to inspect, an import left behind between two experiments, a print of what
# a tool returned, and reaching into MCPServer's internals are all the point of
# the file and must not fail the commit hook.
"run/*" = ["F401", "F841", "T201", "INP001", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.codespell]
# `uv run codespell` (a documented dev command) walks the whole tree, so the
# generated and vendored paths have to be named here. The prek hook only ever
# sees git-tracked files and needs none of it.
skip = "./.git,./.venv,./uv.lock,./coverage.xml,./.coverage,./.mypy_cache,./.pytest_cache,./.ruff_cache,./htmlcov"

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["paperless_mcp"]

[tool.coverage.covdefaults]
# covdefaults omits */__main__.py, but tests/test_config.py drives main(),
# resolve_settings() and build_parser() directly. The omission hides lines the
# suite already covers, and would hide a regression in the CLI entry point.
subtract_omit = "*/__main__.py"

[tool.coverage.report]
# covdefaults defaults this to 100, which is a suppression generator: every
# defensive line then needs a pragma, and those are forbidden here. The real
# figure is tracked instead, and it is ratcheted deliberately - never lowered to
# accommodate a change. 99 leaves room for exactly what is left: the one branch
# where two callers race into PaperlessConnection's handshake lock, which no test
# can force deterministically.
fail_under = 99
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Explicit because pytest-asyncio warns at config time while it is unset, which
# `filterwarnings = ["error"]` would turn into a collection failure.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov --cov-report=term --cov-report=xml"
# pypaperless is pinned exactly, so a DeprecationWarning out of it is the earliest
# signal that the pin has to move: it must fail the run, not scroll past it.
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.13"
strict = true
# tests/ is checked too, at the same strictness. The fakes exist to catch
# pypaperless drift, and a fake mypy cannot see through is exactly the drift they
# were meant to catch: before this, test_lifespan.py asserted on three attributes
# the real PaperlessClient does not have. No per-module relaxation - that is a
# suppression with an extra step. run/ stays out for the same reason it carries
# the F401/F841 exemption: it is a scratch pad, not code.
files = ["src/paperless_mcp", "tests"]
mypy_path = "src"
