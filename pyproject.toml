[project]
name = "paperless-mcp"
version = "0.2.0"
description = "Model Context Protocol server for Paperless-ngx, backed by pypaperless."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Tobias Schulz" }]
keywords = ["paperless", "paperless-ngx", "mcp", "model-context-protocol", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    # 2.0 renamed FastMCP to MCPServer and moved mcp.server.fastmcp to
    # mcp.server.mcpserver, so the major is capped: an unbounded `>=` would let
    # a future major install a version this package cannot import, which an MCP
    # client reports only as "server disconnected".
    "mcp>=2.0.0,<3",
    "pypaperless==6.0.0rc2",
    # Kept in step with pypaperless: the AsyncClient built here is handed to
    # PaperlessClient, so both halves must agree on the httpx version.
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.0",
    "starlette>=1.3.1,<2",
]

[project.scripts]
paperless-mcp = "paperless_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/tb1337/paperless-mcp"
Issues = "https://github.com/tb1337/paperless-mcp/issues"

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.0",
    "prek>=0.4.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_mcp"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "D",             # pydocstyle
]
ignore = [
    "D203",          # one-blank-line-before-class (conflicts with D211)
    "D213",          # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"src/paperless_mcp/__main__.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["paperless_mcp"]
mypy_path = "src"
