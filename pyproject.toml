[project]
name = "paperless-mcp"
# Placeholder. The release workflow rewrites this from the git tag before
# building, so the tag is the single source of truth for a published version.
version = "0.0.0"
description = "Model Context Protocol server for Paperless-ngx, backed by pypaperless."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Tobias Schulz" }]
keywords = ["paperless", "paperless-ngx", "mcp", "model-context-protocol", "llm"]
classifiers = [
    # Matches the warning at the top of the README: the tool surface still
    # shifts and the pypaperless dependency is a release candidate.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = [
    # 2.0 renamed FastMCP to MCPServer and moved mcp.server.fastmcp to
    # mcp.server.mcpserver, so the major is capped: an unbounded `>=` would let
    # a future major install a version this package cannot import, which an MCP
    # client reports only as "server disconnected".
    "mcp>=2.0.0,<3",
    "pypaperless==6.0.0rc2",
    # Kept in step with pypaperless: the AsyncClient built here is handed to
    # PaperlessClient, so both halves must agree on the httpx version. The major
    # is capped because httpx 1.x drops `httpx.AsyncClient` (1.0.dev3 exposes
    # only `Client`), which both halves annotate against. pypaperless itself
    # requires an unbounded `httpx>=0.28.1`, so nothing upstream stops a
    # resolver from reaching 1.x — and one does: `--prerelease=allow`, which
    # users need for the pypaperless rc, picks 1.0.dev3 and the server then dies
    # on import with "module 'httpx' has no attribute 'AsyncClient'".
    "httpx>=0.28.1,<1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.0",
    "starlette>=1.3.1,<2",
]

[project.scripts]
paperless-mcp = "paperless_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/tb1337/paperless-mcp"
"Source Code" = "https://github.com/tb1337/paperless-mcp"
"Bug Reports" = "https://github.com/tb1337/paperless-mcp/issues"
Coverage = "https://codecov.io/gh/tb1337/paperless-mcp"

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "covdefaults>=2.3.0",
    "coverage>=7.15.2",
    "mypy>=2.3.0",
    "prek>=0.4.11",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "yamllint>=1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_mcp"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "D",             # pydocstyle
]
ignore = [
    "D203",          # one-blank-line-before-class (conflicts with D211)
    "D213",          # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"src/paperless_mcp/__main__.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.codespell]
skip = "./uv.lock,./.git"

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["paperless_mcp"]

[tool.coverage.report]
# covdefaults defaults this to 100; the real figure is tracked here instead so
# the gate moves deliberately rather than by accident.
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --cov --cov-report=term --cov-report=xml"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["paperless_mcp"]
mypy_path = "src"
